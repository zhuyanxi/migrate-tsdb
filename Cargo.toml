[workspace]
members = [
  "crates/tsdb-reader",
  "crates/migrate-core",
  "crates/tsdb-migrate-cli",
  "crates/tsdb-migrate-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
memmap2 = "0.9"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
object_store = { version = "0.14", features = ["aws"] }
futures = "0.3"
md-5 = "0.10"
crossbeam-channel = "0.5"
arrow-array = "60.1"
arrow-schema = "60.1"
parquet = { version = "60.1", features = ["arrow", "zstd", "snap"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
